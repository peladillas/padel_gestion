version: '3.8'

# All secrets come from the (git-ignored) .env next to this file — see
# .env.example. Nothing sensitive is hardcoded here.

services:
  postgres:
    image: postgres:16-alpine
    container_name: bonapinta_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bonapinta}
      POSTGRES_USER: ${POSTGRES_USER:-bonapinta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bonapinta} -d ${POSTGRES_DB:-bonapinta}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Laravel API (php-fpm). The only container that runs migrations.
  api:
    build:
      context: ./laravel
      target: app
    container_name: bonapinta_api
    restart: always
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-bonapinta}
      DB_USERNAME: ${POSTGRES_USER:-bonapinta}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      UPLOADS_PATH: /var/www/uploads
      RUN_MIGRATIONS: "1"
    volumes:
      - ./uploads:/var/www/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # php-fpm only starts listening after the entrypoint finished
      # (config check + migrations), so "port open" == "ready".
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Runs `schedule:work`: auto-confirms player-proposed results after 24h.
  scheduler:
    build:
      context: ./laravel
      target: app
    container_name: bonapinta_scheduler
    restart: always
    command: ["php", "artisan", "schedule:work"]
    env_file: .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: ${POSTGRES_DB:-bonapinta}
      DB_USERNAME: ${POSTGRES_USER:-bonapinta}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      UPLOADS_PATH: /var/www/uploads
      RUN_MIGRATIONS: "0"
    volumes:
      - ./uploads:/var/www/uploads
    depends_on:
      api:
        condition: service_healthy

  # Inner nginx: PHP via fastcgi + uploads straight from disk.
  api-web:
    build:
      context: ./laravel
      target: web
    container_name: bonapinta_api_web
    restart: always
    volumes:
      - ./uploads:/var/www/uploads:ro
    depends_on:
      api:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: bonapinta_frontend
    volumes:
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-web
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

volumes:
  postgres_data:
