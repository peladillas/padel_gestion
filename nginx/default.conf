server {
    listen 80;
    server_name bonapinta.com www.bonapinta.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name bonapinta.com www.bonapinta.com;

    ssl_certificate /etc/letsencrypt/live/bonapinta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bonapinta.com/privkey.pem;

    # TLS terminates here, so HSTS belongs here (not in PHP).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # No cache for HTML so browsers always get the latest index.html
    location ~* \.html$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Long-term cache for hashed assets (JS, CSS)
    location ~* \.(js|css|woff2?|png|jpg|svg|ico)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ^~ prevents regex blocks (jpg/png/etc.) from intercepting upload files
    location ^~ /uploads/ {
        proxy_pass http://bonapinta_api_web:80/uploads/;
        proxy_set_header Host $host;
    }

    # Laravel API (inner nginx → php-fpm). X-Forwarded-For matters: the API
    # trusts it so per-IP rate limits apply to each client, not to this proxy.
    location /api {
        client_max_body_size 6M;
        proxy_pass http://bonapinta_api_web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name pigeon.bonapinta.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name pigeon.bonapinta.com;
    ssl_certificate /etc/letsencrypt/live/pigeon.bonapinta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pigeon.bonapinta.com/privkey.pem;
    location / {
        proxy_pass http://172.17.0.1:8001;
        proxy_set_header Host $host;
        client_max_body_size 10M;
    }
}

server {
    listen 80;
    server_name taxishare.bonapinta.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name taxishare.bonapinta.com;

    ssl_certificate /etc/letsencrypt/live/taxishare.bonapinta.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taxishare.bonapinta.com/privkey.pem;

    location /api/ {
        proxy_pass http://host.docker.internal:3031;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /socket.io/ {
        proxy_pass http://host.docker.internal:3031;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location / {
        proxy_pass http://host.docker.internal:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

