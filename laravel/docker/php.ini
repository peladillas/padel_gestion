; Production PHP settings for the Bonapinta API (php-fpm).
expose_php = Off
memory_limit = 256M
; Avatars are capped at 5 MB in UploadController (Express used the same limit).
upload_max_filesize = 6M
post_max_size = 8M
; Never print errors to the response — Laravel logs them.
display_errors = Off
log_errors = On

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Code is baked into the image and never changes at runtime.
opcache.validate_timestamps = 0
