# Inner web tier of the API: serves Laravel through php-fpm and uploaded
# files straight from disk. The public-facing nginx (nginx/default.conf)
# terminates TLS and proxies /api and /uploads here.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    client_max_body_size 6M;
    server_tokens off;

    # Uploaded avatars: served by nginx directly (no PHP), read-only mount.
    location ^~ /uploads/ {
        alias /var/www/uploads/;
        try_files $uri =404;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-site" always;
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri /index.php?$query_string;
    }

    # The only PHP entry point.
    location = /index.php {
        fastcgi_pass api:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) { deny all; }
}
